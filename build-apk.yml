name: Build Android Camera APK

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and restore Android project files
        run: |
          echo "" | base64 -d > /tmp/camera_project.zip
          unzip -o /tmp/camera_project.zip -d .
          ls -la app/src/main/AndroidManifest.xml app/src/main/java/com/example/camera/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
